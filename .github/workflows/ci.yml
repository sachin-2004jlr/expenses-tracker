name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # No PostgreSQL and no Ollama in CI: embedded PGlite + the mock AI provider.
      AI_PROVIDER: mock
      PGLITE_DATA_DIR: memory://
      APP_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships npm 11, which is what maintains package-lock.json locally.
      # npm 10 (Node 22) rejects npm 11 lock files that omit optional WASM runtime packages.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm install` (not `npm ci`): the lock still pins every version, but install does not
      # abort on optional WASM packages that npm writes differently across versions/platforms.
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
